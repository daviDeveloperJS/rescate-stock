    <div class="registroProductos">

        <h1>Registrar Producto</h1>
        <form>
            <label for="input_nombre">Nombre del producto:
                <input id="input_nombre" type="text" required>
            </label><br>

            <label for="input_cantidad">Cantidad: 
                <input 
                    id="input_cantidad"
                    type="text" 
                    min="1" 
                    step="1" 
                    required>
            </label><br>


            <label for="input_precio">Precio normal:
                <input 
                    id="input_precio" 
                    type="text" 
                    min="0.01"
                    step="0.01"
                    required>
            </label><br>

            <label for="input_vencimiento">Vencimiento
                <input id="input_vencimiento" type="date" required>
            </label><br>

            <button id="btn_agregarProducto">Agregar Producto</button>
        </form>
        <p id="parrafo"></p>
        <section id="lista_productos"></section>
    </div>
    <script src="script.js"></script>
</body>
